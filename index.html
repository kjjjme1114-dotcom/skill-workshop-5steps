<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SKILL 도출 워크샵 · 5단계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --sky-a:#7FC0E6; --sky-b:#AFDAEF; --sky-c:#E4F2F6; --sun:#FFF3CC;
  --mt-a:#9FB6D2; --mt-b:#8AA4C2; --hill-a:#A7CE92; --hill-b:#81BA6E; --hill-c:#62A052;
  --grass:#579448; --grass-d:#3C7439; --path:#E6CE9E; --path-d:#C9A974;
  --paper:#FDF9F0; --paper-2:#F5EDDD; --paper-3:#EBE0C9; --line:#E0D3B8; --line-2:#F0E7D6;
  --ink:#393024; --ink-2:#6E6050; --ink-3:#9C8D79;
  --gold:#EDB245; --gold-h:#FFD37C; --gold-d:#CE9420; --gold-i:#8A5A12;
  --ok:#2F9B72; --ok-bg:#E7F5EE; --warn:#D2803C; --warn-bg:#FCF1E4; --bad:#CE5B4C; --bad-bg:#FBEAE7;
  --c1:#5289CE; --c2:#2F9B72; --c3:#D9A032; --c4:#9270C2; --c5:#D9705C; --c6:#3C9CA0;
  --fd:"Jua","Noto Sans KR",sans-serif;
  --fb:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --s1:0 1px 3px rgba(60,42,20,.09),0 4px 12px rgba(60,42,20,.07);
  --s2:0 10px 34px rgba(50,34,14,.20);
  --s3:0 28px 80px rgba(30,18,6,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#231708;color:var(--ink);font-family:var(--fb);overflow:hidden;font-size:15px;line-height:1.66;word-break:keep-all}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 28%,#7A5530,#231708 76%)}
#frame{position:relative;width:1280px;height:720px;transform-origin:center;border-radius:20px;overflow:hidden;box-shadow:var(--s3)}
canvas{display:block;width:1280px;height:720px}

/* ══ 상단 ══ */
#top{position:absolute;inset:0 0 auto 0;padding:15px 18px;display:flex;gap:14px;align-items:flex-start;
  justify-content:space-between;pointer-events:none;background:linear-gradient(180deg,rgba(26,16,6,.40),transparent)}
.glass{background:rgba(253,249,240,.94);border-radius:16px;box-shadow:var(--s1);pointer-events:auto}
#me{display:flex;align-items:center;gap:8px;padding:7px 9px 7px 15px;flex:none}
#me b{font-family:var(--fd);font-size:13.5px;color:var(--ink-2);font-weight:400}
#me input{width:100px;border:none;background:#F1E9D8;border-radius:10px;padding:6px 11px;font-family:var(--fb);font-size:13px;color:var(--ink);outline:none}
#me input:focus{box-shadow:0 0 0 2px var(--gold)}
#rail{display:flex;align-items:center;padding:9px 14px;gap:0}
#rail .nd{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0 3px;transition:.16s}
#rail .nd:hover{transform:translateY(-2px)}
#rail .dot{width:29px;height:29px;border-radius:11px;display:grid;place-items:center;font-family:var(--fd);
  font-size:13.5px;color:#fff;background:#CBBCA2;transition:.2s;box-shadow:inset 0 -2px 0 rgba(0,0,0,.13)}
#rail .nd.on .dot{background:linear-gradient(180deg,#43B189,var(--ok))}
#rail .nd.cur .dot{transform:scale(1.2);box-shadow:0 0 0 4px rgba(237,178,69,.45),inset 0 -2px 0 rgba(0,0,0,.13)}
#rail .nd small{font-family:var(--fd);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
#rail .nd.cur small{color:var(--gold-i)}
#rail .lk{width:26px;height:3px;border-radius:2px;background:#E2D7C0;margin-bottom:15px}
#rail .lk.on{background:#8FD3B8}
#pct{font-family:var(--fd);font-size:13px;color:var(--gold-i);background:#FCEFD4;border-radius:10px;padding:5px 11px;margin-left:9px}

/* ══ 하단 ══ */
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);pointer-events:none;font-family:var(--fd);
  font-size:14.5px;color:#FFF7E6;text-shadow:0 2px 8px rgba(26,14,2,.8);background:rgba(38,24,10,.36);
  padding:8px 20px;border-radius:999px;backdrop-filter:blur(4px);transition:opacity .22s}
#pad{position:absolute;right:16px;bottom:16px;display:flex;gap:9px}
#pad button{width:56px;height:56px;border:none;border-radius:17px;cursor:pointer;font-family:var(--fd);font-size:19px;
  color:var(--ink-2);background:rgba(253,249,240,.9);box-shadow:var(--s1)}
#pad button:active{transform:translateY(2px)}
#pad button.go{background:linear-gradient(180deg,var(--gold-h),var(--gold-d));color:#4A3008}
#sv{position:absolute;left:18px;bottom:22px;font-family:var(--fd);font-size:12px;color:#FFF7E6;opacity:0;
  transition:opacity .45s;background:rgba(38,24,10,.42);padding:5px 13px;border-radius:999px}
#sv.on{opacity:1}

/* ══ 대화창 ══ */
#dlg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(30,18,6,.55);
  backdrop-filter:blur(5px);overflow:auto;animation:fi .2s ease}
#dlg[hidden]{display:none}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
.card{width:100%;max-width:1010px;max-height:680px;display:flex;flex-direction:column;background:var(--paper);
  border-radius:22px;box-shadow:var(--s2);overflow:hidden;animation:up .24s cubic-bezier(.2,.9,.3,1)}
.ch{position:relative;display:flex;gap:14px;align-items:center;padding:16px 20px;color:#fff;flex:none;overflow:hidden}
.ch::after{content:"";position:absolute;right:-40px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09)}
.ch .av{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.22);flex:none;display:grid;
  place-items:center;font-family:var(--fd);font-size:20px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.ch h2{margin:0;font-family:var(--fd);font-size:22px;font-weight:400;letter-spacing:.3px}
.ch p{margin:2px 0 0;font-size:12.5px;opacity:.88}
.ch .rl{margin-left:auto;display:flex;gap:5px;align-items:center;z-index:1}
.ch .rl i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.ch .rl i.on{background:#fff}
.ch .rl i.me{width:22px;border-radius:5px;background:#fff}
.ch .x{background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;width:34px;height:34px;
  border-radius:11px;font-size:16px;flex:none;z-index:1;margin-left:10px}
.ch .x:hover{background:rgba(255,255,255,.32)}
.cb{padding:17px 22px 6px;overflow:auto;flex:1}
.cf{padding:12px 20px 15px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);
  background:linear-gradient(180deg,var(--paper-2),#F1E8D5);flex:none}
.cf .sp{margin-left:auto;font-size:12px;color:var(--ink-3)}
.say{background:#FFFDF6;border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:12px 16px;
  margin:0 0 16px;font-size:14.5px;color:var(--ink-2);box-shadow:var(--s1)}
.say b{color:var(--ink)}

/* ══ 폼 ══ */
label.f{display:block;margin:0 0 4px}
label.f>span{display:block;font-family:var(--fd);font-size:14.5px;color:#7A5A30;margin-bottom:5px}
label.f>span em{font-style:normal;color:var(--ink-3);font-family:var(--fb);font-size:12px;margin-left:6px}
.fg{margin:0 0 14px}
.in{width:100%;padding:9px 12px;background:#fff;border:1.5px solid var(--line);border-radius:11px;
  font-family:var(--fb);font-size:14.5px;color:var(--ink);outline:none;transition:.14s}
.in::placeholder{color:#BEB19C}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(237,178,69,.2)}
textarea.in{min-height:84px;resize:vertical;line-height:1.72}
select.in{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.tip{font-size:13px;color:var(--ink-3);margin:-4px 0 13px;line-height:1.62}
.sec{font-family:var(--fd);font-size:15px;color:#7A5A30;margin:20px 0 9px;padding-left:10px;border-left:4px solid var(--gold)}

/* ══ 예시 칩 ══ */
.ex{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0 0;padding:6px 8px;
  background:#FBF4E4;border-radius:10px;border:1px dashed #E4D6B6}
.ex>span{font-family:var(--fd);font-size:11px;color:var(--gold-i);background:#F7E3B8;border-radius:6px;padding:2px 8px;flex:none}
.ex button,.exb{font-family:var(--fb);font-size:12px;border:1px solid #E7D9BC;background:#fff;color:var(--ink-2);
  border-radius:8px;padding:4px 10px;cursor:pointer;transition:.13s;text-align:left;line-height:1.4}
.ex button:hover,.exb:hover{border-color:var(--gold);background:#FFF6E1;color:var(--ink)}
.ex button:active{transform:translateY(1px)}

.btn{font-family:var(--fd);font-size:15px;border:none;border-radius:12px;padding:10px 20px;cursor:pointer;
  color:#4A3008;background:linear-gradient(180deg,var(--gold-h),var(--gold));box-shadow:0 3px 0 var(--gold-d);transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--gold-d)}
.btn.g{background:#fff;color:#7A5A30;box-shadow:0 3px 0 var(--line)}
.btn.g:active{box-shadow:0 0 0 var(--line)}
.btn.sm{font-size:13.5px;padding:7px 14px;box-shadow:0 2px 0 var(--gold-d)}
.btn.g.sm{box-shadow:0 2px 0 var(--line)}
.btn.dk{background:linear-gradient(180deg,#59B792,#2F9B72);color:#fff;box-shadow:0 3px 0 #217A59}
.btn.rd{background:linear-gradient(180deg,#F0F0F0,#E4E4E4);color:#B3453A;box-shadow:0 3px 0 #CFCFCF}
.btn.demo{background:linear-gradient(180deg,#F4EBFB,#E8DAF7);color:#6B4A98;box-shadow:0 2px 0 #D4BFEF;font-size:13px;padding:7px 14px}

.tabs{display:flex;gap:6px;margin:0 0 15px;flex-wrap:wrap}
.tabs button{font-family:var(--fd);font-size:13.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);
  border-radius:999px;padding:7px 16px;cursor:pointer;transition:.15s}
.tabs button.on{background:linear-gradient(180deg,#8A6236,#6E4C28);border-color:#6E4C28;color:#FFF7E6;box-shadow:var(--s1)}
.tabs button i{font-style:normal;font-size:11px;background:var(--gold);color:#4A3008;border-radius:999px;padding:1px 6px;margin-left:5px}
.tabs button.on i{background:rgba(255,255,255,.28);color:#fff}

.rows{display:flex;flex-direction:column;gap:7px;margin:0 0 10px}
.rw{display:grid;gap:7px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 9px}
.rw.a{grid-template-columns:1.5fr 1.1fr 1.1fr 32px}
.rw.b{grid-template-columns:1fr 1.2fr 32px}
.del{border:none;background:var(--bad-bg);color:var(--bad);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px}
.del:hover{background:#F6D8D2}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:20px;border:1.5px dashed var(--line);
  border-radius:13px;background:#FFFDF6;margin-bottom:10px}

.tw{overflow:auto;border:1.5px solid var(--line);border-radius:13px;background:#fff;margin:0 0 12px;max-height:250px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:660px}
table.t th{font-family:var(--fd);font-weight:400;font-size:12.5px;color:#7A5A30;background:var(--paper-2);
  padding:9px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2}
table.t td{padding:5px 8px;border-top:1px solid var(--line-2);vertical-align:middle}
table.t tr.sel td{background:#FFF7E3}
table.t .in{padding:6px 8px;font-size:13.5px;border-width:1px}
.num{text-align:right;font-family:var(--fd);color:var(--gold-i);white-space:nowrap}

.quad{position:relative;height:238px;border-radius:15px;margin:0 0 13px;overflow:hidden;border:1.5px solid var(--line);
  background:linear-gradient(135deg,#F2EFE4 0%,#F2EFE4 49%,#FCF3DE 51%,#F9E7C2 100%)}
.quad .ax{position:absolute;background:#DFD2B6}
.quad .lb{position:absolute;font-family:var(--fd);font-size:11px;color:var(--ink-3);padding:5px 9px}
.quad .zn{position:absolute;font-family:var(--fd);font-size:11.5px;color:#AC9878;padding:8px 12px}
.quad .pt{position:absolute;transform:translate(-50%,50%);cursor:pointer;transition:.2s}
.quad .pt b{display:block;width:15px;height:15px;border-radius:50%;background:var(--c1);border:2.5px solid #fff;box-shadow:var(--s1)}
.quad .pt.hot b{background:var(--bad)}
.quad .pt.sel b{background:var(--gold);width:22px;height:22px;box-shadow:0 0 0 5px rgba(237,178,69,.32)}
.quad .pt span{position:absolute;left:20px;top:-3px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;
  background:rgba(255,255,255,.86);border-radius:6px;padding:1px 6px}

.step{background:#fff;border:1.5px solid var(--line);border-radius:14px;margin:0 0 9px;overflow:hidden;transition:.16s}
.step.open{border-color:var(--gold);box-shadow:0 0 0 3px rgba(237,178,69,.16)}
.sh{display:grid;grid-template-columns:30px 1fr 92px 130px 60px 30px;gap:7px;align-items:center;padding:8px 9px}
.sh .no{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;font-family:var(--fd);font-size:13px;color:#fff}
.exp{border:none;background:var(--paper-2);border-radius:9px;width:28px;height:28px;cursor:pointer;color:var(--ink-2);font-size:12px}
.exp:hover{background:var(--paper-3)}
.sd{padding:4px 11px 12px;border-top:1px dashed var(--line);margin-top:3px}
.sd .fg{margin-bottom:11px}
.sd textarea.in{min-height:56px;font-size:13.5px}
.bars{display:flex;height:28px;border-radius:9px;overflow:hidden;margin:0 0 5px;background:var(--paper-3);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.bars div{display:grid;place-items:center;font-size:11px;color:#fff;font-family:var(--fd);overflow:hidden;white-space:nowrap;min-width:0}
.lg{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin:0 0 14px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

.al{border-radius:12px;padding:11px 15px;margin:0 0 13px;font-size:13.5px;line-height:1.66}
.al.w{background:var(--warn-bg);border-left:4px solid var(--warn);color:#8A4E1E}
.al.o{background:var(--ok-bg);border-left:4px solid var(--ok);color:#1E6B4E}
.al.b{background:var(--bad-bg);border-left:4px solid var(--bad);color:#8A3226}
.al ul{margin:6px 0 0;padding-left:18px}
.al li{margin:3px 0}

.gauge{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:15px 17px;margin:0 0 13px}
.ring{width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.ring i{position:absolute;inset:10px;background:#fff;border-radius:50%}
.ring b{position:relative;font-family:var(--fd);font-size:24px;color:var(--gold-i)}
.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;flex:1}
.chk li{font-size:12.8px;color:var(--ink-3)}
.chk li.y{color:var(--ok)}
.chk li::before{content:"○ ";font-family:var(--fd)}
.chk li.y::before{content:"● "}
pre.md{background:#30251A;color:#F0DDB2;border-radius:14px;padding:16px 18px;font-size:12.5px;line-height:1.75;
  overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;margin:0 0 13px;box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:30;background:rgba(38,24,10,.94);
  color:#FFF7E6;font-family:var(--fd);font-size:14.5px;padding:11px 24px;border-radius:999px;box-shadow:var(--s2);animation:up .2s ease}
@media(max-width:760px){.g2,.chk{grid-template-columns:1fr}
  .sh{grid-template-columns:28px 1fr 30px}.sh select,.sh input[type=number]{grid-column:2/4}}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="top">
    <div class="glass" id="me"><b>참가자</b><input id="nm" placeholder="이름" maxlength="12"></div>
    <div class="glass" id="rail"></div>
  </div>
  <div id="hint"></div><div id="sv">저장됨</div>
  <div id="pad">
    <button data-k="ArrowLeft">←</button><button data-k="ArrowRight">→</button>
    <button data-k=" ">↑</button><button class="go" data-k="Enter">입장</button>
  </div>
  <div id="dlg" hidden></div>
</div></div>
<script>
"use strict";
/*═════════ 저장 ═════════*/
const KEY="skillforge:v3";
const blank=()=>({who:"",tasks:[],sel:null,
  def:{trigger:"",client:"",input:"",outName:"",outForm:"보고서 / 문서",sections:"",vol:""},
  steps:[],branches:[],terms:[],rules:{must:"",never:"",tone:""},dod:"",ex:{good:"",bad:""},done:[]});
let D=blank();
try{const r=localStorage.getItem(KEY);if(r)D=Object.assign(blank(),JSON.parse(r));}catch(e){}
let svt=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}
  const s=document.getElementById("sv");s.classList.add("on");
  clearTimeout(svt);svt=setTimeout(()=>s.classList.remove("on"),1100);}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const att=s=>esc(s).replace(/\n/g,"&#10;");
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/*═════════ 예시 칩 ═════════*/
function E(t,v,add){
  const f=v.split("\n"),n=f.length;
  let lab=f[0];if(lab.length>32)lab=lab.slice(0,32)+"…";
  return `<button class="exb" data-t="${t}" data-v="${att(v)}"${add?' data-m="add"':""}>${esc(lab)}${n>1?` <span style="color:#B09A78">+${n-1}줄</span>`:""}</button>`;
}
const EX=(...b)=>`<div class="ex"><span>예시</span>${b.join("")}</div>`;
function bindEx(el){
  el.querySelectorAll("[data-t][data-v]").forEach(b=>b.onclick=()=>{
    const p=b.dataset.t.split(":"),v=b.dataset.v,add=b.dataset.m==="add";
    const put=(o,k)=>{o[k]=(add&&o[k]&&o[k].trim())?o[k].replace(/\s+$/,"")+"\n"+v:v;};
    if(p[0]==="d")put(D.def,p[1]);
    else if(p[0]==="r")put(D.rules,p[1]);
    else if(p[0]==="e")put(D.ex,p[1]);
    else if(p[0]==="dod")put(D,"dod");
    else if(p[0]==="s"&&D.steps[+p[1]])put(D.steps[+p[1]],p[2]);
    save();re();});
}

/*═════════ 데이터 ═════════*/
const CYC=[
 {k:"day",n:"매일",yr:230,hint:"아침에 컴퓨터를 켜고 <b>가장 먼저</b> 하는 일은? 하루에 두 번 이상 여는 파일·시스템은? 퇴근 전 꼭 확인하는 것은?"},

let tab5="rule";
function slug(s){return String(s||"skill").trim().replace(/\s+/g,"-").replace(/[^\w가-힣-]/g,"").slice(0,44)||"skill";}
function quality(){
  const t=selT()||{},F=D.def,R=D.rules,f=D.steps.filter(s=>s.a.trim());
  const c=[["대상 업무를 골랐다",!!t.t,7],["시작 신호가 구체적이다",(F.trigger||"").length>=6,8],
   ["산출물 칸이 3개 이상이다",lines(F.sections).length>=3,13],["입력물을 적었다",lines(F.input).length>=1,6],
   ["절차가 4단계 이상이다",f.length>=4,11],["판단 단계가 있다",D.steps.some(s=>s.type==="판단"&&s.a.trim()),9],
   ["검증 단계가 있다",D.steps.some(s=>s.type==="검증"&&s.a.trim()),8],
   ["단계마다 출력이 있다",f.length>0&&f.every(s=>s.out.trim()),7],
   ["노하우를 2개 이상 적었다",f.filter(s=>s.watch.trim()||s.miss.trim()).length>=2,10],
   ["갈림길이 2개 이상이다",D.branches.filter(b=>b.cond.trim()&&b.act.trim()).length>=2,9],
   ["금지 사항이 2줄 이상이다",lines(R.never).length>=2,6],["완료 기준이 3줄 이상이다",lines(D.dod).length>=3,9],
   ["좋은 예를 적었다",!!D.ex.good.trim(),4],["사내 용어를 풀었다",D.terms.some(x=>x.k.trim()&&x.v.trim()),3]];
  const tot=c.reduce((s,x)=>s+x[2],0),got=c.reduce((s,x)=>s+(x[1]?x[2]:0),0);
  return {c,pct:Math.round(got/tot*100)};
}
function buildMD(){
  const t=selT()||{},F=D.def,R=D.rules,L=[];
  const li=s=>lines(s).length?lines(s).map(x=>"- "+x).join("\n"):"- (적지 않음)";
  const title=F.outName||t.t||"이름 없는 SKILL";
  L.push("---","name: "+slug(t.t||title),
   "description: "+(F.trigger?F.trigger+" 시점에 ":"")+(t.t||title)+" 하여 "+(F.outName||"산출물")+"을(를) 만든다."+(F.client?" 수신: "+F.client+".":""),
   "---","","# "+title,"",
   "## 1. 언제 실행하나",F.trigger||"(적지 않음)","");
  if(F.client)L.push("**받아 보는 사람** — "+F.client,"");
  L.push("## 2. 무엇을 받아서 시작하나",li(F.input),"",
   "## 3. 무엇을 내놓아야 하나","**"+(F.outName||"산출물")+"** ("+F.outForm+")"+(F.vol?" · "+F.vol:""),"",
   "아래 칸을 모두 채운다. 칸의 순서와 이름을 바꾸지 않는다.","",li(F.sections),"","## 4. 절차","");
  const f=D.steps.filter(s=>s.a.trim());
  if(!f.length)L.push("(적지 않음)","");
  f.forEach((s,i)=>{
    L.push("### "+(i+1)+". "+s.a.trim()+"  `"+s.type+"` `"+s.actor+"`"+(s.min?" `"+s.min+"분`":""));
    if(s.in.trim())L.push("- 입력 — "+s.in.trim());
    if(s.out.trim())L.push("- 출력 — "+s.out.trim());
    lines(s.watch).forEach(x=>L.push("- 확인할 것 — "+x));
    lines(s.miss).forEach(x=>L.push("- 주의(흔한 실수) — "+x));
    L.push("");});
  const br=D.branches.filter(b=>b.cond.trim());
  L.push("## 5. 갈림길과 예외","");
  if(br.length){L.push("| 이런 경우엔 | 이렇게 한다 |","|---|---|");
    br.forEach(b=>L.push("| "+b.cond.trim()+" | "+(b.act.trim()||"(적지 않음)")+" |"));L.push("");}
  else L.push("(적지 않음)","");
  L.push("## 6. 판단 기준",li(R.tone),"","## 7. 반드시 지킬 것",li(R.must),"","## 8. 절대 하지 말 것",li(R.never));
  const am=D.steps.map(s=>lines(s.miss)).flat();am.forEach(x=>L.push("- "+x));L.push("");
  const tm=D.terms.filter(x=>x.k.trim()&&x.v.trim());
  if(tm.length){L.push("## 9. 용어","");tm.forEach(x=>L.push("- **"+x.k.trim()+"** — "+x.v.trim()));L.push("");}
  L.push("## 10. 완료 기준","","아래를 모두 만족해야 끝난 것이다. 하나라도 어긋나면 그 부분을 다시 처리한다.","",
   lines(D.dod).map(x=>"- [ ] "+x).join("\n")||"- [ ] (적지 않음)","");
  if(D.ex.good.trim()||D.ex.bad.trim()){L.push("## 11. 예시","");
   if(D.ex.good.trim())L.push("**이렇게 쓴다**","","> "+D.ex.good.trim().split("\n").join("\n> "),"");
   if(D.ex.bad.trim())L.push("**이렇게 쓰지 않는다**","","> "+D.ex.bad.trim().split("\n").join("\n> "),"");}
  L.push("---","","만든 사람: "+(D.who||"-")+" · "+new Date().toLocaleDateString("ko-KR")+
   (t.t?" · 현재 연간 투입 약 "+hrs(t).toFixed(0)+"시간":""));
  return L.join("\n");
}

  g.font='13px "Jua","Noto Sans KR",sans-serif';g.textAlign="center";g.textBaseline="middle";
  const w=g.measureText(txt).width+24;
  g.fillStyle="rgba(52,36,16,.6)";rp(x-w/2,y-12,w,24,12);g.fill();
  g.fillStyle="#FFF7E6";g.fillText(txt,x,y+1);}
function bird(x,y,s,t){g.save();g.strokeStyle="rgba(70,80,95,.55)";g.lineWidth=1.8*s;
  const f=Math.sin(t/9)*4*s;
  g.beginPath();g.moveTo(x-7*s,y+f);g.quadraticCurveTo(x-3*s,y-3*s,x,y);
  g.quadraticCurveTo(x+3*s,y-3*s,x+7*s,y+f);g.stroke();g.restore();}

const motes=Array.from({length:30},()=>({x:Math.random()*WORLD,y:Math.random()*430+50,s:Math.random()*.7+.4,p:Math.random()*7,v:Math.random()*.25+.1}));
const lvs=Array.from({length:14},()=>({x:Math.random()*WORLD,y:Math.random()*330+70,s:Math.random()*.6+.6,p:Math.random()*7,v:Math.random()*.4+.25}));
const P={x:250,vx:0,dir:1,h:0,vh:0,ground:true,walk:0,near:null};
let cam=0,T=0;const K={};
function frame(){
  T++;
  if(!cur){
    const sp=(K.ArrowLeft||K.a?-1:0)+(K.ArrowRight||K.d?1:0);
    P.vx=sp*4.5;if(sp)P.dir=sp;
    P.x=clamp(P.x+P.vx,60,WORLD-60);
    P.walk=sp&&P.ground?P.walk+1:0;
    if((K[" "]||K.ArrowUp||K.w)&&P.ground){P.vh=12.4;P.ground=false;}
    if(!P.ground){P.h+=P.vh;P.vh-=.62;if(P.h<=0){P.h=0;P.vh=0;P.ground=true;}}
  }else{P.vx=0;P.walk=0;}
  cam+=(clamp(P.x-CW/2,0,WORLD-CW)-cam)*.085;

  sky();
  for(let i=0;i<9;i++){const x=((i*560-cam*.07)%(CW+460)+CW+460)%(CW+460)-230;
    cloud(x,52+(i%4)*44,.5+(i%3)*.26,.42+(i%3)*.16);}
  [[0,-cam*.05+T*.06],[1,-cam*.05+T*.06+40],[2,-cam*.05+T*.06+72]].forEach(([i,o])=>{
    bird(((o+i*90)%(CW+120)+CW+120)%(CW+120)-60,118+i*16,.9,T+i*13);});
  ridge(cam*.12,296,58,460,C["mt-a"],.85);
  ridge(cam*.20,336,44,320,C["mt-b"],.9);
  g.save();g.globalAlpha=.32;g.fillStyle="#DCEBF2";g.fillRect(0,250,CW,140);g.restore();
  ridge(cam*.34,388,32,240,C["hill-a"]);
  for(let i=0;i<30;i++){const x=(i*168-cam*.34)%(WORLD*.34);if(x>-60&&x<CW+60)tree(x,400+((i*41)%14),.36,0);}
  ridge(cam*.54,436,24,200,C["hill-b"]);
  for(let i=0;i<24;i++){const x=(i*214-cam*.54)%(WORLD*.54);if(x>-70&&x<CW+70)tree(x,450+((i*57)%10),.56,0);}

  const gg=g.createLinearGradient(0,GY-16,0,CH);
  gg.addColorStop(0,C["hill-c"]);gg.addColorStop(.12,C["grass"]);gg.addColorStop(1,C["grass-d"]);
  g.fillStyle=gg;g.fillRect(0,GY-16,CW,CH-GY+16);
  g.fillStyle=C["hill-c"];
  for(let i=-1;i<CW/15+2;i++){const x=i*15-(cam%15);g.beginPath();g.ellipse(x,GY-16,10,8,0,Math.PI,0);g.fill();}
  g.fillStyle=C["path"];g.fillRect(0,GY+62,CW,58);
  g.fillStyle="rgba(120,90,45,.14)";g.fillRect(0,GY+62,CW,6);
  g.fillStyle=C["path-d"];
  for(let i=0;i<CW/46+2;i++){const x=i*46-(cam%46);
    EL(x+((i%2)*18),GY+82+((i*13)%14),13,5,C["path-d"]);}
  for(let i=0;i<64;i++){const x=(i*121-cam*1.02)%(WORLD*1.02);
    if(x>-20&&x<CW+20)flower(x,GY+34+((i*47)%22),["#F3E27A","#F4A9C0","#FFFFFF","#EFC1F2"][i%4]);}

  P.near=null;
  ST.forEach((s,i)=>{
    const sx=s.x-cam,done=D.done.includes(s.id);
    if(Math.abs(P.x-s.x)<82&&P.ground)P.near=s;
    if(sx<-280||sx>CW+280)return;
    bush(sx-150,GY+10,.72,"#4C8C44","#9BDC7C");
    tree(sx+168,GY+8,.72,1);
    lamp(sx-118,GY+6,done,T+i*17);
    shop(sx,GY+6,s,done,T,i);
    flag(sx+108,GY+2,T+i*27,s.col);
    person(sx+62,GY+8,s.face,-1,0,1,Math.sin(T/27+i)*1.7);
    plate(sx+62,GY+28,s.role);
    bub(sx+62,GY-104,done?"✓":"!",done?"#2F9B72":"#D9A032",T+i*40);});

  person(P.x-cam,GY+8-P.h,{skin:"#F3D0AC",hair:"#2C2118",cloth:"#2F4A8A"},P.dir,P.walk,1.08,
    P.walk?Math.sin(P.walk*.46)*1.7:Math.sin(T/32)*1.4);
  if(D.who)plate(P.x-cam,GY+32-P.h,D.who);

  lvs.forEach(l=>{const x=l.x-cam*.92,y=l.y+Math.sin(T/38+l.p)*26;
    if(x>-20&&x<CW+20){g.save();g.globalAlpha=.55;g.translate(x,y);g.rotate(T/44+l.p);
      EL(0,0,6*l.s,3.4*l.s,"#93C666");g.restore();}
    l.x-=l.v;if(l.x<0)l.x=WORLD;});
  for(let i=0;i<16;i++){const x=(i*268-cam*1.2)%(WORLD*1.2);
    if(x>-90&&x<CW+90)bush(x,CH-10,1.2,"#3C7439");}
  motes.forEach(m=>{const x=m.x-cam*1.05,y=m.y+Math.sin(T/30+m.p)*16;
    if(x>-10&&x<CW+10){g.save();g.globalAlpha=.30+Math.sin(T/24+m.p)*.16;
      EL(x,y,2.1*m.s,2.1*m.s,"#FFF6D2");g.restore();}
    m.x-=m.v;if(m.x<0)m.x=WORLD;});

  const v=g.createRadialGradient(CW/2,CH*.46,CH*.40,CW/2,CH*.5,CH*1.02);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(40,24,8,.34)");
  g.fillStyle=v;g.fillRect(0,0,CW,CH);
  g.save();g.globalCompositeOperation="overlay";g.globalAlpha=.06;g.fillStyle="#FFCE7A";g.fillRect(0,0,CW,CH);g.restore();

  const h=$("#hint");
  if(cur)h.style.opacity=0;
  else{h.style.opacity=1;
    h.innerHTML=P.near?`<b>${esc(P.near.name)}</b> — Enter 로 들어가기`
      :"← → 걷기 · Space 점프 · Enter 로 입장 · 위 진행바를 눌러 바로 이동";}
  const m=$("#rail .nd.cur");
  if((P.near&&!m)||(!P.near&&m)||(P.near&&m&&+m.dataset.go!==ST.indexOf(P.near)))drawRail();
  requestAnimationFrame(frame);
}
/*═════════ 입력 ═════════*/
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&cur){shut();return;}
  if(cur)return;
  if(e.key==="Enter"){if(P.near){e.preventDefault();talk(P.near);}return;}
  K[e.key]=true;K[e.key.toLowerCase()]=true;
  if([" ","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault();});
addEventListener("keyup",e=>{K[e.key]=false;K[e.key.toLowerCase()]=false;});
$("#pad").querySelectorAll("button").forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();if(k==="Enter"){if(P.near&&!cur)talk(P.near);}else K[k]=true;};
  const off=e=>{e.preventDefault();K[k]=false;};
  b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);
  b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);});
$("#nm").value=D.who;$("#nm").oninput=e=>{D.who=e.target.value;save();};
function fit(){$("#frame").style.transform="scale("+Math.min(innerWidth/1300,innerHeight/740)+")";}
addEventListener("resize",()=>{fit();dpr();});
fit();drawRail();frame();
</script>
</body>
</html>
